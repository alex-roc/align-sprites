<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og image</title>
<style>
  @font-face { font-family: 'Pixelify Sans'; font-weight: 600; src: url('../../node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Atkinson'; font-weight: 200 800; src: url('../../node_modules/@fontsource-variable/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-wght-normal.woff2') format('woff2'); }
  :root { --paper: #F1F0F6; --ink: #1E1A33; --ink-soft: #5F5A78; --action: #3346D3; --stage: #2A2640; --check-a: #34304C; --check-b: #2C2842; --key: #E01BD6; --ground: #FFC531; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: 'Atkinson', sans-serif; position: relative; }
  .text { position: absolute; left: 72px; top: 76px; width: 500px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo { display: inline-flex; align-items: flex-end; gap: 6px; height: 50px; }
  .logo i { display: block; width: 14px; border-radius: 2px; background: var(--ink); }
  .logo i:nth-child(1) { height: 27px; } .logo i:nth-child(2) { height: 42px; background: var(--action); } .logo i:nth-child(3) { height: 34px; }
  .wordmark { font: 600 52px/1 'Pixelify Sans', monospace; letter-spacing: 0.01em; }
  h1 { margin-top: 56px; font-size: 54px; line-height: 1.08; font-weight: 750; letter-spacing: -0.01em; }
  p { margin-top: 26px; font-size: 25px; line-height: 1.4; color: var(--ink-soft); max-width: 470px; }
  .engines { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 10px; }
  .engines span { font-size: 21px; font-weight: 650; padding: 8px 16px; border-radius: 8px; background: #fff; border: 1.5px solid #DCD9E8; }
  .raw { position: absolute; right: 64px; top: 52px; width: 420px; transform: rotate(4deg); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(30,26,51,.18); }
  .raw img { display: block; width: 100%; }
  .tag { position: absolute; font-size: 19px; font-weight: 700; padding: 6px 12px; border-radius: 6px; }
  .tag.ai { right: 76px; top: 26px; background: var(--key); color: #fff; transform: rotate(4deg); z-index: 2; }
  .stage { position: absolute; right: 40px; bottom: 44px; width: 560px; height: 280px; border-radius: 16px; overflow: hidden;
    background-color: var(--stage); background-image: conic-gradient(var(--check-a) 25%, var(--check-b) 0 50%, var(--check-a) 0 75%, var(--check-b) 0);
    background-size: 24px 24px; box-shadow: inset 0 2px 12px rgba(0,0,0,.35), 0 14px 34px rgba(30,26,51,.25); }
  .frames { position: absolute; left: 0; right: 0; bottom: 46px; display: flex; justify-content: center; gap: 0; }
  .frames img { image-rendering: pixelated; height: 128px; margin: 0 4px; }
  .ground { position: absolute; left: 34px; right: 34px; bottom: 45px; border-top: 3px dashed var(--ground); }
  .tag.ok { right: 56px; bottom: 300px; background: var(--ground); color: var(--ink); z-index: 2; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><span class="logo"><i></i><i></i><i></i></span><span class="wordmark">align-sprites</span></div>
    <h1>Turn AI sprites into game-ready sheets</h1>
    <p>Same scale, feet on one line, a true pixel grid. Free, in your browser.</p>
  </div>
  <div class="engines"><span>Godot 4</span><span>GDevelop 5</span><span>Kaplay</span></div>
  <span class="tag ai">AI image</span>
  <div class="raw"><img src="../../public/examples/hero-run.png" alt=""></div>
  <span class="tag ok">Ready for your engine</span>
  <div class="stage"><div class="ground"></div><div class="frames" id="frames"></div></div>
  <script>
    // after-*.png are written by scripts/og-image.ts (normalized frames of the same sheet).
    const n = Number(new URLSearchParams(location.search).get('n') || 4);
    const box = document.getElementById('frames');
    for (let i = 0; i < n; i++) { const im = new Image(); im.src = `after-${i}.png`; box.append(im); }
  </script>
</body>
</html>
